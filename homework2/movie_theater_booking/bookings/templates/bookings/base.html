<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>
            {% block title %}HW2 Movie Theater{% endblock %}
        </title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">    
    </head>
    <body>
        <nav class="navbar navbar-expand navbar-light bg-light">
            <a class="navbar-brand" href="/">HW2 Movie Theater</a>
            {% if user.is_authenticated %}
                <a class="nav-link text-dark" href="{% url 'booking_history' %}">My Bookings</a>
            {% endif %}
            <div class="ms-auto d-flex align-items-center">
                {% if user.is_authenticated %}
                    <span class="navbar-text text-success me-3">
                        <i></i> {{ user.username }}
                    </span>
                    <form method="post" action="{% url 'logout' %}" class="m-0">
                        {% csrf_token %}
                        <button type="submit" class="btn btn-outline-dark btn-sm">Logout</button>
                    </form>
                {% else %}
                    <a class="btn btn-outline-dark btn-sm" href="{% url 'login' %}">
                        <i class="bi bi-box-arrow-in-right"></i> Login
                    </a>
                {% endif %}
            </div>
        </nav>
        <div class="container my-4">
            {% block content %}
            {% endblock %}
        </div>
    </body>
</html>
